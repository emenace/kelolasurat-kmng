<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surat Keluar - Kemenag Metro</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <!-- Tabulator CSS -->
    <link href="https://unpkg.com/tabulator-tables@5.5.0/dist/css/tabulator_simple.min.css" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
            --color-kemenag: #006b3f;
            --color-kemenag-dark: #004d2d;
            --color-kemenag-light: #28a745;
        }
    </style>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../style.css">
</head>

<body class="bg-gray-50 min-h-screen">

    <!-- Navbar -->
    <nav class="bg-gradient-to-r from-kemenag to-kemenag-dark shadow-lg mb-6">
        <div class="max-w-full mx-auto px-4 sm:px-6">
            <div class="flex items-center justify-between h-14">
                <a href="../index.html" class="flex items-center gap-2 text-white font-semibold no-underline hover:text-green-200 transition-colors">
                    <img src="../assets/Kementerian_Agama_new_logo.png" alt="Logo" class="h-8">
                    <i class="bi bi-arrow-left-circle"></i>
                    <span>Kembali</span>
                </a>
                <span class="text-white font-bold text-sm sm:text-base">Pencatatan Surat Keluar</span>
            </div>
        </div>
    </nav>

    <div class="max-w-full mx-auto px-4 sm:px-6">
        <div class="flex flex-col lg:flex-row gap-6">
            <!-- Form Section -->
            <div class="lg:w-[380px] shrink-0">
                <div class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-100">
                    <div class="px-5 py-3 border-b-2 border-kemenag bg-gray-50">
                        <h2 class="text-sm font-bold text-kemenag-dark flex items-center gap-2">
                            <i class="bi bi-plus-circle"></i>Tambah Data Surat Keluar
                        </h2>
                    </div>
                    <div class="p-5">
                        <form id="formSuratKeluar">
                            <input type="hidden" id="id_surat">
                            <div class="mb-4">
                                <label for="nomor_urut" class="block text-sm font-medium text-gray-700 mb-1">Nomor Urut</label>
                                <input type="number" id="nomor_urut" required class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:ring-2 focus:ring-kemenag/40 focus:border-kemenag outline-none transition">
                            </div>
                            <div class="mb-4">
                                <label for="tanggal_surat" class="block text-sm font-medium text-gray-700 mb-1">Tanggal Surat</label>
                                <input type="date" id="tanggal_surat" required class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:ring-2 focus:ring-kemenag/40 focus:border-kemenag outline-none transition">
                            </div>
                            <div class="mb-4">
                                <label for="nomor_surat" class="block text-sm font-medium text-gray-700 mb-1">Nomor Surat</label>
                                <input type="text" id="nomor_surat" required class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:ring-2 focus:ring-kemenag/40 focus:border-kemenag outline-none transition">
                            </div>
                            <div class="mb-4">
                                <label for="asal_surat" class="block text-sm font-medium text-gray-700 mb-1">Asal Surat</label>
                                <input type="text" id="asal_surat" required class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:ring-2 focus:ring-kemenag/40 focus:border-kemenag outline-none transition">
                            </div>
                            <div class="mb-4">
                                <label for="tujuan" class="block text-sm font-medium text-gray-700 mb-1">Tujuan</label>
                                <input type="text" id="tujuan" required class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:ring-2 focus:ring-kemenag/40 focus:border-kemenag outline-none transition">
                            </div>
                            <div class="mb-4">
                                <label for="isi_surat" class="block text-sm font-medium text-gray-700 mb-1">Isi Surat / Perihal</label>
                                <textarea id="isi_surat" rows="2" required class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:ring-2 focus:ring-kemenag/40 focus:border-kemenag outline-none transition"></textarea>
                            </div>
                            <div class="mb-5">
                                <label for="keterangan" class="block text-sm font-medium text-gray-700 mb-1">Keterangan</label>
                                <input type="text" id="keterangan" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:ring-2 focus:ring-kemenag/40 focus:border-kemenag outline-none transition">
                                <label class="flex items-center gap-2 mt-2 cursor-pointer">
                                    <input type="checkbox" id="keterangan_manual" class="rounded border-gray-300 text-kemenag focus:ring-kemenag">
                                    <span class="text-sm text-gray-600">Input Manual</span>
                                </label>
                            </div>
                            <div class="flex flex-col gap-2">
                                <button type="submit" id="btn-submit" class="btn-kemenag w-full py-2.5 rounded-lg bg-kemenag text-white font-semibold text-sm hover:bg-kemenag-dark transition-colors flex items-center justify-center gap-2">
                                    <i class="bi bi-save"></i>Simpan Data
                                </button>
                                <button type="button" id="btn-cancel-edit" class="hidden w-full py-2 rounded-lg bg-gray-500 text-white font-medium text-sm hover:bg-gray-600 transition-colors">
                                    Batal Edit
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Table Section -->
            <div class="flex-1 min-w-0">
                <div class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-100 h-full">
                    <div class="px-5 py-3 border-b-2 border-kemenag bg-gray-50 flex justify-between items-center flex-wrap gap-2">
                        <h2 class="text-sm font-bold text-kemenag-dark flex items-center gap-2">
                            <i class="bi bi-table"></i>Data Surat Keluar
                        </h2>
                        <div class="flex gap-2 items-center flex-wrap">
                            <input type="text" id="global-search" placeholder="Cari data..." class="rounded-lg border border-gray-300 px-3 py-1.5 text-sm focus:ring-2 focus:ring-kemenag/40 focus:border-kemenag outline-none transition w-40">
                            <button id="download-pdf" class="px-3 py-1.5 rounded-lg border border-red-300 text-red-600 text-xs font-medium hover:bg-red-50 transition whitespace-nowrap">Export PDF</button>
                            <button id="download-xlsx" class="px-3 py-1.5 rounded-lg border border-blue-300 text-blue-600 text-xs font-medium hover:bg-blue-50 transition whitespace-nowrap">Export Excel</button>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <div id="table-surat-keluar"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="text/javascript" src="https://unpkg.com/tabulator-tables@5.5.0/dist/js/tabulator.min.js"></script>
    <script type="text/javascript" src="https://oss.sheetjs.com/sheetjs/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="surat-keluar.js"></script>
</body>

</html>
