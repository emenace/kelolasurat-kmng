<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Tata Kelola Surat - Kemenag Metro</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
            --color-kemenag: #006b3f;
            --color-kemenag-dark: #004d2d;
            --color-kemenag-light: #28a745;
        }
    </style>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-50 min-h-screen">

    <!-- Navbar -->
    <nav class="bg-gradient-to-r from-kemenag to-kemenag-dark shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="index.html" class="flex items-center gap-3 text-white font-bold text-lg no-underline">
                    <img src="assets/Kementerian_Agama_new_logo.png" alt="Logo Kemenag" class="h-10">
                    <span class="hidden sm:inline">Aplikasi Layanan Kepegawaian Kemenag Kota Metro</span>
                    <span class="sm:hidden">Kemenag Metro</span>
                </a>
                <button id="btn-logout" onclick="doLogout()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white/15 text-white text-xs font-medium hover:bg-white/25 transition border border-white/20">
                    <i class="bi bi-box-arrow-right"></i>
                    <span class="hidden sm:inline">Logout</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-5xl mx-auto px-4 py-12">
        <div class="text-center mb-12">
            <h1 class="text-3xl sm:text-4xl font-bold text-gray-800 mb-3">Selamat Datang</h1>
            <p class="text-gray-500 text-lg">Sistem Layanan Kepegawaian Internal Kantor Kementerian Agama Kota Metro</p>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-5 max-w-3xl mx-auto">
            <!-- Surat Keluar -->
            <a href="surat-keluar/surat-keluar.html" class="group no-underline">
                <div class="bg-white rounded-2xl shadow-md hover:shadow-xl p-6 flex flex-col items-center justify-center gap-4 h-48 transition-all duration-300 group-hover:-translate-y-1.5 border border-gray-100 group-hover:border-kemenag/30">
                    <div class="w-16 h-16 rounded-full bg-emerald-50 flex items-center justify-center group-hover:bg-emerald-100 transition-colors">
                        <i class="bi bi-send text-kemenag text-3xl"></i>
                    </div>
                    <span class="text-gray-700 font-semibold text-sm text-center">Surat Keluar</span>
                </div>
            </a>

            <!-- Data Pegawai -->
            <a href="data-pegawai/data_pegawai.html" class="group no-underline">
                <div class="bg-white rounded-2xl shadow-md hover:shadow-xl p-6 flex flex-col items-center justify-center gap-4 h-48 transition-all duration-300 group-hover:-translate-y-1.5 border border-gray-100 group-hover:border-amber-300/50">
                    <div class="w-16 h-16 rounded-full bg-amber-50 flex items-center justify-center group-hover:bg-amber-100 transition-colors">
                        <i class="bi bi-people text-amber-600 text-3xl"></i>
                    </div>
                    <span class="text-gray-700 font-semibold text-sm text-center">Data Pegawai</span>
                </div>
            </a>

            <!-- Surat Tugas -->
            <a href="surat-tugas/surat_tugas.html" class="group no-underline">
                <div class="bg-white rounded-2xl shadow-md hover:shadow-xl p-6 flex flex-col items-center justify-center gap-4 h-48 transition-all duration-300 group-hover:-translate-y-1.5 border border-gray-100 group-hover:border-rose-300/50">
                    <div class="w-16 h-16 rounded-full bg-rose-50 flex items-center justify-center group-hover:bg-rose-100 transition-colors">
                        <i class="bi bi-briefcase text-rose-600 text-3xl"></i>
                    </div>
                    <span class="text-gray-700 font-semibold text-sm text-center">Buat Surat Tugas</span>
                </div>
            </a>

            <!-- SK Cuti -->
            <a href="sk-cuti/sk_cuti.html" class="group no-underline">
                <div class="bg-white rounded-2xl shadow-md hover:shadow-xl p-6 flex flex-col items-center justify-center gap-4 h-48 transition-all duration-300 group-hover:-translate-y-1.5 border border-gray-100 group-hover:border-sky-300/50">
                    <div class="w-16 h-16 rounded-full bg-sky-50 flex items-center justify-center group-hover:bg-sky-100 transition-colors">
                        <i class="bi bi-calendar-check text-sky-600 text-3xl"></i>
                    </div>
                    <span class="text-gray-700 font-semibold text-sm text-center">Buat SK Cuti</span>
                </div>
            </a>
        </div>
    </div>

    <script>
        function doLogout() {
            fetch('/api/logout', { method: 'POST' })
                .then(() => { window.location.href = '/login.html'; })
                .catch(() => { window.location.href = '/login.html'; });
        }
    </script>
</body>

</html>
